services:
  database:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: zyger_erp
      POSTGRES_USER: zyger
      POSTGRES_PASSWORD: zyger123
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - target: 5432
        published: 5433
        protocol: tcp
        mode: host
    networks:
      - zyger-net
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
      placement:
        constraints:
          - node.role == manager

  backend:
    image: zygererp-backend:latest
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://database:5432/zyger_erp
      DB_USERNAME: zyger
      DB_PASSWORD: zyger123
      SERVER_PORT: "9090"
      CORS_ORIGINS: http://localhost,http://localhost:8081
      JWT_SECRET: change-me-in-production-use-a-256-bit-random-string
      JWT_EXPIRATION_MS: "3600000"
    ports:
      - target: 9090
        published: 9090
        protocol: tcp
        mode: host
    networks:
      - zyger-net
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
      placement:
        constraints:
          - node.role == manager

  frontend:
    image: zygererp-frontend:latest
    depends_on:
      - backend
    ports:
      - target: 80
        published: 8081
        protocol: tcp
        mode: host
    networks:
      - zyger-net
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
      placement:
        constraints:
          - node.role == manager

volumes:
  pgdata:

networks:
  zyger-net:
    name: zyger-net
