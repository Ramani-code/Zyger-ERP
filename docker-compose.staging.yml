# =====================================================================
# Zyger ERP — Staging Docker Compose
#
# Only the "nginx" service publishes ports to the host (port 80).
# PostgreSQL, backend, and frontend run on an internal network only.
#
# Secrets come from environment (see .env.staging / .env.staging.example).
# NEV/ER run "docker compose down -v" casually — it destroys the named
# volumes (pg_staging_data, zyger_uploads).
# =====================================================================

name: zyger-staging

services:
  # ---------- PostgreSQL (internal only) ----------
  postgres:
    image: postgres:18-alpine
    container_name: zyger-staging-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ:-Asia/Kolkata}
    # NOTE: on PostgreSQL 18 the volume MUST mount /var/lib/postgresql
    # (not /var/lib/postgresql/data); 18 stores data in a versioned subdir.
    volumes:
      - pg_staging_data:/var/lib/postgresql
    # DB is NOT exposed to the host; reachable only on the internal network
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - staging-net

  # ---------- Spring Boot backend (internal only) ----------
  backend:
    build:
      context: ./zyger-erp-backend
    image: zygererp-backend:staging
    container_name: zyger-staging-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-staging}
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      SERVER_PORT: "9090"
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-2592000000}
      CORS_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      PASSWORD_MIN_LENGTH: ${PASSWORD_MIN_LENGTH:-8}
      HIDDEN_ADMIN_PASSWORD: ${HIDDEN_ADMIN_PASSWORD}
      MAX_LOGIN_ATTEMPTS: ${MAX_LOGIN_ATTEMPTS:-5}
      LOCKOUT_MINUTES: ${LOCKOUT_MINUTES:-15}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-20}
      DB_POOL_MIN_IDLE: ${DB_POOL_MIN_IDLE:-4}
      TZ: ${TZ:-Asia/Kolkata}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
    volumes:
      - zyger_uploads:/app/uploads
    expose:
      - "9090"
    # Bounds the container so -XX:MaxRAMPercentage in the JVM entrypoint has
    # a real limit to scale against (otherwise it sees the whole host).
    mem_limit: 768m
    networks:
      - staging-net

  # ---------- React frontend (internal only, static files) ----------
  frontend:
    build:
      context: ./zyger-erp-frontend
      args:
        VITE_API_BASE_URL: /api
    image: zygererp-frontend:staging
    container_name: zyger-staging-frontend
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - staging-net
    depends_on:
      - backend

  # ---------- Nginx reverse proxy (ONLY public entry point) ----------
  nginx:
    build:
      context: ./nginx
    image: zygererp-nginx:staging
    container_name: zyger-staging-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    depends_on:
      - backend
      - frontend
    networks:
      - staging-net

networks:
  staging-net:
    name: zyger-staging-net
    driver: bridge

volumes:
  pg_staging_data:
    name: zyger-staging-pgdata
  zyger_uploads:
    name: zyger-staging-uploads
