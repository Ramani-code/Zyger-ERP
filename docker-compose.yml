services:
  database:
    image: postgres:18-alpine
    container_name: Zyger-ERP-Database
    environment:
      POSTGRES_DB: ${DB_NAME:-zyger_erp}
      POSTGRES_USER: ${DB_USERNAME:-zyger}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-zyger123}
    # NOTE: on PostgreSQL 18 the volume MUST mount /var/lib/postgresql
    # (not /var/lib/postgresql/data); 18 stores data in a versioned subdir.
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "${DB_PORT:-5433}:5432"
    networks:
      - zyger-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-zyger} -d ${DB_NAME:-zyger_erp}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./zyger-erp-backend
      target: runtime
    image: zygererp-backend
    container_name: Zyger-ERP-Backend
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/actuator/health/liveness"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://database:5432/${DB_NAME:-zyger_erp}
      DB_USERNAME: ${DB_USERNAME:-zyger}
      DB_PASSWORD: ${DB_PASSWORD:-zyger123}
      SERVER_PORT: ${SERVER_PORT:-9090}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:8081}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: always
      MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
    ports:
      - "${SERVER_PORT:-9090}:9090"
    networks:
      - zyger-net
    restart: unless-stopped

  frontend:
    build:
      context: ./zyger-erp-frontend
      args:
        VITE_API_BASE_URL: /api
    image: zygererp-frontend
    container_name: Zyger-ERP-Frontend
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    ports:
      - "${FRONTEND_PORT:-9091}:80"
    networks:
      - zyger-net
    restart: unless-stopped

volumes:
  pgdata:

networks:
  zyger-net:
    name: zygererp-zyger-net
